<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hamid App Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1600&q=80') no-repeat center center/cover;
      min-height: 100vh;
      color: white;
    }

    .overlay {
      background: rgba(0, 0, 0, 0.7);
      min-height: 100vh;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #00ffcc;
    }

    nav a {
      color: white;
      margin: 0 10px;
      text-decoration: none;
      transition: 0.3s;
    }

    nav a:hover {
      color: #00ffcc;
    }

    .hero {
      text-align: center;
      margin-top: 80px;
    }

    .hero h1 {
      font-size: 50px;
      color: #00ffcc;
    }

    .hero p {
      margin-top: 10px;
      font-size: 18px;
      color: #ddd;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      background: #00ffcc;
      color: black;
      font-weight: bold;
      cursor: pointer;
      border-radius: 8px;
    }

    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 60px;
    }

    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      border-radius: 12px;
      text-align: center;
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
      background: rgba(0, 255, 204, 0.2);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding: 10px;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="overlay">

    <header>
      <div class="logo">Hamid App Store</div>
      <nav>
        <a href="#">Home</a>
        <a href="#apps">Apps</a>
        <a href="#contact">Contact</a>
      </nav>
    </header>

    <section class="hero">
      <h1>Welcome to Hamid App Store</h1>
      <p>Download your favorite apps & games with modern style</p>
      <button class="btn">Explore Now</button>
    </section>

    <section id="apps" class="apps">
      <div class="card">
        <img src="https://images.unsplash.com/photo-1605902711622-cfb43c4437d3?auto=format&fit=crop&w=400&q=80" />
        <h3>Game App</h3>
        <p>Best gaming experience</p>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1611162616305-c69b3fa7fbe0?auto=format&fit=crop&w=400&q=80" />
        <h3>Utility App</h3>
        <p>Useful daily tools</p>
      </div>

      <div class="card">
        <img src="https://images.unsplash.com/photo-1616469829581-73993eb86b02?auto=format&fit=crop&w=400&q=80" />
        <h3>Social App</h3>
        <p>Connect with friends</p>
      </div>
    </section>

    <footer>
      © 2026 Hamid App Store | All Rights Reserved
    </footer>

  </div>
</body>
</html>
